name: Deploy mobile PWA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_fleet:
        description: Refresh verified public boat directories before deploying
        type: boolean
        default: false
  schedule:
    # Monday 06:17 Asia/Seoul (Sunday 21:17 UTC).
    - cron: '17 21 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: mobile_pwa
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh public boat directory
        id: fishing_catalog
        continue-on-error: true
        if: github.event_name == 'schedule' || inputs.refresh_fleet == true
        run: node scripts/update-fleet.mjs --live --api

      - name: Refresh registered Sunsang24 public directories
        id: sunsang_catalog
        continue-on-error: true
        if: github.event_name == 'schedule' || inputs.refresh_fleet == true
        run: node scripts/update-sunsang-fleet.mjs --live --api

      - name: Report catalog refresh failure
        if: steps.fishing_catalog.outcome == 'failure' || steps.sunsang_catalog.outcome == 'failure'
        run: |
          echo '::warning::One or more catalog updates failed; the last verified catalog is retained.'
          echo '목록 갱신 실패: 이전 검증 목록을 보존했습니다. 수집 단계 로그를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"

      - name: Test app
        # Avoid resource contention between full-catalog DOM suites.
        run: pnpm test --maxWorkers=2

      - name: Install browser for local fixture checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Test responsive keyboard journeys with mocked providers
        timeout-minutes: 5
        run: pnpm test:browser

      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-verification
          path: mobile_pwa/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check API build
        run: pnpm run api:check

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build app for its Pages URL
        env:
          PWA_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run build

      - name: Save verified catalog to GitHub
        if: github.event_name == 'schedule' || inputs.refresh_fleet == true
        run: |
          git add src/data/defaultFleet.json src/data/sunsang24Fleet.json src/data/catalogSync.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified public boat directory'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not start another Pages build; deploy this tested checkout here.

      - name: Upload built app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: mobile_pwa/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
